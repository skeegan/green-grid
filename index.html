<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Green Grid — a times-tables trainer for 8 to 10 year olds. Practice without a clock, race once you know them, turn the grid green.">
<meta name="theme-color" content="#3DBB7A">
<title>Green Grid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: one phone-width column. Home = grid + two big buttons. Session = one giant fact, number pad, thin timer. */
:root{
  --bg:#F6F7F2; --card:#FFFFFF; --fg:#1F2A24; --muted:#6C756F; --line:#DDE2DB;
  --g0:#E6E9E3; --g1:#F7C96B; --g2:#3DBB7A; --g2d:#1E7F4F;
  --acc:#2F6FE4; --acc-bg:#E8F0FF; --no:#E0564F; --no-bg:#FDEBEA; --ok:#1E7F4F;
  --race:#F08A24;
  --font:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --card:#1E2522; --fg:#EEF2EE; --muted:#9AA59E; --line:#2E3733;
  --g0:#2A322E; --g1:#B8852A; --g2:#2E9B63; --g2d:#9FE1BF; --acc:#6B9BFF; --acc-bg:#1B2A45; --no:#F07A73; --no-bg:#4A2220; --ok:#7CD9A8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --card:#1E2522; --fg:#EEF2EE; --muted:#9AA59E; --line:#2E3733;
  --g0:#2A322E; --g1:#B8852A; --g2:#2E9B63; --g2d:#9FE1BF; --acc:#6B9BFF; --acc-bg:#1B2A45; --no:#F07A73; --no-bg:#4A2220; --ok:#7CD9A8; color-scheme:dark}
:root[data-skin="sky"]{--acc:#2F6FE4;--acc-bg:#E8F0FF}
:root[data-skin="berry"]{--acc:#B53FA0;--acc-bg:#F8E6F5}
:root[data-skin="lava"]{--acc:#E0562E;--acc-bg:#FDEBE4}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:700;font-size:17px;line-height:1.4;
  padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:440px;width:100%;margin:0 auto;display:grid;gap:14px}
.screen{display:none}.screen.on{display:grid;gap:14px}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:-.5px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.pill b{color:var(--fg)}
.card{background:var(--card);border-radius:18px;padding:14px}
.grid{display:grid;grid-template-columns:24px repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:11px;font-weight:900;width:100%}
.grid .h{display:grid;place-items:center;color:var(--muted);height:22px;overflow:hidden}
.grid .c{aspect-ratio:1;border-radius:4px;background:var(--g0);transition:background .3s}
.grid .c.l1{background:var(--g1)}.grid .c.l2{background:var(--g2)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.big{font:inherit;font-weight:900;font-size:22px;padding:18px 10px;border-radius:16px;border:0;cursor:pointer;color:#fff;background:var(--acc);display:grid;gap:2px;justify-items:center}
.big small{font-size:13px;font-weight:700;opacity:.9}
.big.race{background:var(--race)}
.big:disabled{opacity:.45;cursor:not-allowed}
.big:focus-visible,.pad button:focus-visible,.chip:focus-visible,.link:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:13px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.chip{font:inherit;font-weight:900;font-size:15px;min-width:40px;height:38px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chip.sel{border-color:var(--acc);background:var(--acc-bg);color:var(--acc)}
.chip.sw{width:38px;min-width:38px;padding:0;border-width:3px}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--acc)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{aspect-ratio:1;border-radius:14px;background:var(--g0);display:grid;place-items:center;text-align:center;padding:6px;font-size:11px;line-height:1.15;color:var(--muted)}
.badge.got{background:var(--g1);color:#4A2E00}
.badge span{font-size:22px;display:block;margin-bottom:3px}
/* session */
.bar{height:10px;border-radius:999px;background:var(--g0);overflow:hidden}
.bar div{height:100%;background:var(--race);width:100%;transition:width .1s linear}
.prog{height:6px;border-radius:999px;background:var(--g0);overflow:hidden}
.prog div{height:100%;background:var(--g2);transition:width .2s}
.fact{text-align:center;font-size:clamp(44px,14vw,64px);font-weight:900;letter-spacing:-1px;line-height:1;padding:26px 0 10px;font-variant-numeric:tabular-nums}
.ans{display:inline-block;min-width:1.4em;border-bottom:5px solid var(--acc);color:var(--acc)}
.ans.ok{color:var(--ok);border-color:var(--ok)}.ans.no{color:var(--no);border-color:var(--no)}
.fb{text-align:center;min-height:52px;font-size:17px;color:var(--muted);padding:0 8px}
.fb.no{color:var(--fg)}
.fb b{color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pad[hidden],.bar[hidden],.card[hidden],#settings[hidden]{display:none!important}
.pad button{font:inherit;font-weight:900;font-size:30px;height:64px;border-radius:16px;border:0;background:var(--card);color:var(--fg);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad .del{font-size:22px;color:var(--muted)}
.pad.mc{grid-template-columns:repeat(2,minmax(0,1fr))}
.pad.mc button{height:84px;font-size:38px}
.pad.mc button.ok{background:var(--g2);color:#fff}.pad.mc button.no{background:var(--no);color:#fff}
.link{font:inherit;font-weight:900;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:15px;justify-self:center}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.stat div{background:var(--card);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:30px;font-weight:900;line-height:1.1}
.stat small{color:var(--muted);font-size:13px}
.new{display:grid;gap:6px}
.new span{background:var(--acc-bg);color:var(--acc);border-radius:10px;padding:8px 12px;font-size:15px}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .25s}
@keyframes pp{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<main>
<!-- HOME -->
<section class="screen on" id="home">
  <div class="top"><h1>Green Grid</h1><span class="row"><span class="pill" id="streakPill">🔥 <b id="days">0</b> days</span><button class="pill" id="gear" aria-label="Settings" style="font:inherit;cursor:pointer">⚙</button></span></div>
  <div class="card">
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i style="background:var(--g0)"></i>not yet</span><span><i style="background:var(--g1)"></i>know it</span><span><i style="background:var(--g2)"></i>know it fast</span></div>
  </div>
  <div class="btns">
    <button class="big" id="goPractice">Practice<small>no clock · learn new ones</small></button>
    <button class="big race" id="goRace">Race<small id="raceSub">beat the bar</small></button>
  </div>
  <div class="card" style="display:grid;gap:6px">
    <div class="label">Working on</div><div id="workingOn" style="font-size:20px"></div>
  </div>
  <div class="card" id="settings" hidden style="display:grid;gap:14px">
    <div><div class="label">Tables</div><div class="row" id="tables"></div><button class="link" id="autoBack" style="font-size:13px;justify-self:start" hidden>Let the app choose again</button></div>
    <div><div class="label">Colour</div><div class="row" id="skins"></div></div>
    <button class="link" id="reset" style="justify-self:start">Start over</button>
  </div>
  <div class="card"><div class="label" style="margin-bottom:10px">Badges</div><div class="badges" id="badges"></div></div>
</section>

<!-- SESSION -->
<section class="screen" id="play">
  <div class="top"><span class="pill" id="mode">Practice</span><span class="pill"><b id="qnum">1</b> / <span id="qtot">20</span></span></div>
  <div class="bar" id="timer" hidden><div id="timerFill"></div></div>
  <div class="prog"><div id="progFill" style="width:0%"></div></div>
  <div class="fact" id="fact"></div>
  <div class="fb" id="fb"></div>
  <div class="pad" id="pad">
    <button>7</button><button>8</button><button>9</button>
    <button>4</button><button>5</button><button>6</button>
    <button>1</button><button>2</button><button>3</button>
    <button class="del" data-k="del">⌫</button><button>0</button><button class="del" data-k="skip">?</button>
  </div>
  <div class="pad mc" id="choices" hidden></div>
  <button class="link" id="quit">Stop for now</button>
</section>

<!-- SUMMARY -->
<section class="screen" id="done">
  <h1 id="doneTitle">Nice one!</h1>
  <div class="stat"><div><b id="sRight">0</b><small>right</small></div><div><b id="sNew">0</b><small>new cells</small></div><div><b id="sFast">0</b><small>fast ones</small></div></div>
  <div class="card new" id="newList"></div>
  <div class="card" id="newBadges" hidden></div>
  <div class="btns"><button class="big" id="again">Again</button><button class="big" style="background:var(--muted)" id="homeBtn">Home</button></div>
</section>
</main>

<script>
(function(){
// ---------- persistence ----------
var KEY='greengrid.v1';
var S; // state
function load(){ try{ S=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ S=null; }
  if(!S) S={facts:{},sessions:0,days:[],badges:{},tables:[2,10],to12:false,div:false,skin:'sky',auto:true};
  if(!S.tables||!S.tables.length) S.tables=[2];
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
load();
document.documentElement.dataset.skin=S.skin;

// ---------- facts ----------
function tensDone(){ for(var b=1;b<=10;b++) for(var a=1;a<=10;a++){ var f=S.facts[key(a,b)]; if(!f||f.s<3) return false; } return true; }
function maxN(){ return tensDone()?12:10; }
function key(a,b){ return a+'x'+b; }
function F(a,b){ var k=key(a,b); if(!S.facts[k]) S.facts[k]={s:0,f:0,n:0,w:0,last:-99,gap:1}; return S.facts[k]; }
// level: 0 unknown, 1 accurate (3 in a row), 2 fast (3 fast race answers)
function level(a,b){ var f=S.facts[key(a,b)]; if(!f) return 0; if(f.f>=3) return 2; if(f.s>=3) return 1; return 0; }
function allFacts(tbls){ var out=[]; tbls.forEach(function(b){ for(var a=1;a<=maxN();a++) out.push([a,b]); }); return out; }
function knownPool(){ var out=[]; for(var b=1;b<=maxN();b++) for(var a=1;a<=maxN();a++) if(level(a,b)>=1) out.push([a,b]); return out; }
var EASY=[]; for(var a=1;a<=10;a++){ EASY.push([a,1],[a,2],[a,10]); }

// ---------- strategies (recommendation 6) ----------
function strategy(a,b){
  var p=a*b;
  if(b===9||a===9){ var o=b===9?a:b; return o+' × 10 = '+(o*10)+', take away '+o+'.'; }
  if(b===5||a===5){ var o5=b===5?a:b; return o5+' × 10 = '+(o5*10)+', then halve it.'; }
  if(b===4||a===4){ var o4=b===4?a:b; return 'Double '+o4+' is '+(o4*2)+', double again.'; }
  if(b===8||a===8){ var o8=b===8?a:b; return 'Double, double, double: '+(o8*2)+', '+(o8*4)+', '+(o8*8)+'.'; }
  if(b===6||a===6){ var o6=b===6?a:b; return o6+' × 5 = '+(o6*5)+', and one more '+o6+'.'; }
  if(b===3||a===3){ var o3=b===3?a:b; return 'Double '+o3+' is '+(o3*2)+', and one more '+o3+'.'; }
  if(a===b){ return 'A square number. '+a+' rows of '+a+'.'; }
  if(b===7||a===7){ var o7=b===7?a:b; return o7+' × 5 = '+(o7*5)+' and '+o7+' × 2 = '+(o7*2)+'. Add them.'; }
  if(b===11){ return a<10?'11s just repeat the digit: '+a+''+a+'.':'10 × '+a+' = '+(a*10)+', and one more '+a+'.'; }
  if(b===12){ return a+' × 10 = '+(a*10)+', and '+a+' × 2 = '+(a*2)+'. Add them.'; }
  return 'Same as '+b+' × '+a+' = '+p+'.';
}

// ---------- home ----------
var gridEl=document.getElementById('grid');
function drawGrid(){
  var n=maxN(); gridEl.style.setProperty('--cols',n); gridEl.innerHTML='';
  var h=document.createElement('div'); h.className='h'; h.textContent='×'; gridEl.appendChild(h);
  for(var b=1;b<=n;b++){ var hh=document.createElement('div'); hh.className='h'; hh.textContent=b; gridEl.appendChild(hh); }
  for(var a=1;a<=n;a++){
    var rh=document.createElement('div'); rh.className='h'; rh.textContent=a; gridEl.appendChild(rh);
    for(var b2=1;b2<=n;b2++){ var c=document.createElement('div'); c.className='c l'+level(a,b2); c.title=a+' × '+b2; gridEl.appendChild(c); }
  }
}
var ORDER=[2,10,5,3,4,6,9,7,8,11,12];
function tableDone(b){ for(var a=1;a<=maxN();a++) if(level(a,b)<1) return false; return true; }
function advance(){ // graduate finished tables, pull in the next ones; returns names added
  var added=[];
  if(!S.auto) return added;
  S.tables=S.tables.filter(function(b){return !tableDone(b)});
  var i=0; while(S.tables.length<2 && i<ORDER.length){ var b=ORDER[i++]; if(b<=maxN() && S.tables.indexOf(b)<0 && !tableDone(b)){ S.tables.push(b); added.push(b); } }
  S.tables.sort(function(x,y){return x-y});
  return added;
}
function drawWorking(){ var el=document.getElementById('workingOn'); var t=S.tables.slice();
  el.textContent=t.length? (t.length===1?'the '+t[0]+'s':'the '+t.slice(0,-1).join('s, ')+'s and '+t[t.length-1]+'s') : 'all done!';
 }
function drawTables(){
  var el=document.getElementById('tables'); el.innerHTML='';
  for(var b=1;b<=maxN();b++){ (function(b){
    var ch=document.createElement('button'); ch.className='chip'+(S.tables.indexOf(b)>=0?' sel':''); ch.textContent=b;
    ch.addEventListener('click',function(){ S.auto=false; document.getElementById('autoBack').hidden=false; var i=S.tables.indexOf(b); if(i>=0){ if(S.tables.length>1) S.tables.splice(i,1); } else S.tables.push(b); S.tables.sort(function(x,y){return x-y}); save(); drawTables(); drawWorking(); updateRace(); });
    el.appendChild(ch); })(b); }
}
var SKINS={sky:'#2F6FE4',berry:'#B53FA0',lava:'#E0562E'};
function drawSkins(){ var el=document.getElementById('skins'); el.innerHTML='';
  Object.keys(SKINS).forEach(function(k){ var ch=document.createElement('button'); ch.className='chip sw'+(S.skin===k?' sel':''); ch.style.background=SKINS[k]; ch.style.borderColor=S.skin===k?'var(--fg)':'transparent'; ch.setAttribute('aria-label',k);
    ch.addEventListener('click',function(){ S.skin=k; document.documentElement.dataset.skin=k; save(); drawSkins(); }); el.appendChild(ch); }); }

var BADGES=[
  ['first','🌱','First 10','10 facts known', function(){return knownPool().length>=10}],
  ['table','🎯','A whole table','every fact in one table green', function(){ for(var b=1;b<=maxN();b++){ var ok=true; for(var a=1;a<=maxN();a++) if(level(a,b)<2){ok=false;break;} if(ok) return true; } return false; }],
  ['ten','⚡','10 in a row','ten right without a miss', function(){return S.best>=10}],
  ['fast','🚀','Speedy','20 fast answers in races', function(){return (S.fastTotal||0)>=20}],
  ['days3','🔥','3 days running','practised three days in a row', function(){return S.days.length>=3}],
  ['half','🌗','Half way','half the grid green', function(){ var n=maxN(),g=0; for(var a=1;a<=n;a++) for(var b=1;b<=n;b++) if(level(a,b)===2) g++; return g>=n*n/2; }],
  ['fix','🔧','Fixed it','got a fact right after getting it wrong', function(){return !!S.fixed}],
  ['full','👑','Full house','the whole grid green', function(){ var n=maxN(); for(var a=1;a<=n;a++) for(var b=1;b<=n;b++) if(level(a,b)<2) return false; return true; }],
];
function drawBadges(){ var el=document.getElementById('badges'); el.innerHTML='';
  BADGES.forEach(function(bd){ var d=document.createElement('div'); d.className='badge'+(S.badges[bd[0]]?' got':''); d.innerHTML='<div><span>'+bd[1]+'</span>'+bd[2]+'</div>'; d.title=bd[3]; el.appendChild(d); }); }
function checkBadges(){ var got=[]; BADGES.forEach(function(bd){ if(!S.badges[bd[0]]&&bd[4]()){ S.badges[bd[0]]=true; got.push(bd); } }); return got; }

function updateRace(){
  var ready=knownPool().length;
  var btn=document.getElementById('goRace'); btn.disabled=ready<8;
  document.getElementById('raceSub').textContent=ready<8?'learn '+(8-ready)+' more first':'beat the bar';
}
function drawHome(){ advance(); drawGrid(); drawTables(); drawWorking(); drawSkins(); drawBadges(); updateRace();
  document.getElementById('days').textContent=S.days.length;
 }
document.getElementById('gear').addEventListener('click',function(){ var p=document.getElementById('settings'); p.hidden=!p.hidden; document.getElementById('autoBack').hidden=S.auto; });
document.getElementById('autoBack').addEventListener('click',function(){ S.auto=true; advance(); save(); drawHome(); });
document.getElementById('reset').addEventListener('click',function(){ if(this.dataset.arm){ S=null; try{localStorage.removeItem(KEY)}catch(e){} load(); drawHome(); this.textContent='Start over'; delete this.dataset.arm; } else { this.dataset.arm='1'; this.textContent='Tap again to wipe everything'; } });

// ---------- session engine ----------
var mode, queue, qi, right, wrong, streak, newCells, fastCount, timerId, tStart, tLimit, cur, locked, typed, sessionStart, asked;
function show(id){ document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')}); document.getElementById(id).classList.add('on'); window.scrollTo(0,0); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function due(f){ var x=S.facts[key(f[0],f[1])]; return !x || (S.sessions - x.last) >= (x.gap||1); }

// Practice: incremental rehearsal (rec 4) + spacing (rec 5). One unknown, ~9 knowns, then the next unknown.
function buildPractice(){
  var pool=allFacts(S.tables);
  var unknown=shuffle(pool.filter(function(f){return level(f[0],f[1])===0}));
  var known=knownPool();
  if(known.length<6) known=known.concat(EASY.filter(function(e){return !known.some(function(k){return k[0]===e[0]&&k[1]===e[1]})}));
  var dueKnown=shuffle(known.filter(due)), restKnown=shuffle(known.filter(function(f){return !due(f)}));
  var knownSeq=dueKnown.concat(restKnown);
  var q=[], ki=0, target=20;
  var targets=unknown.slice(0,3); // at most 3 new facts per session
  if(!targets.length){ // everything known: spaced review
    q=knownSeq.slice(0,target).map(function(f){return {f:f,newb:false}});
  } else {
    targets.forEach(function(u,idx){
      var reps=[1,2,3,3];
      reps.forEach(function(r){ q.push({f:u,newb:true}); for(var i=0;i<r;i++){ q.push({f:knownSeq[ki%knownSeq.length],newb:false}); ki++; } });
    });
  }
  return q.slice(0,26);
}
function buildRace(){
  var pool=knownPool();
  var amber=shuffle(pool.filter(function(f){return level(f[0],f[1])===1}));
  var green=shuffle(pool.filter(function(f){return level(f[0],f[1])===2}));
  var q=[]; while(q.length<20){ if(amber.length&&(q.length%3!==2||!green.length)) q.push({f:amber.shift()}); else if(green.length) q.push({f:green.shift()}); else break; }
  if(q.length<20){ var more=shuffle(pool.slice()); while(q.length<20&&more.length) q.push({f:more.shift()}); }
  return q;
}

function start(m){
  mode=m; queue=m==='race'?buildRace():buildPractice(); qi=0; right=0; wrong=0; streak=0; newCells=[]; fastCount=0; asked={};
  tLimit=6000; sessionStart=Date.now();
  document.getElementById('mode').textContent=m==='race'?'Race':'Practice';
  document.getElementById('timer').hidden=m!=='race';
  document.getElementById('qtot').textContent=queue.length;
  show('play'); next();
}
function fmt(a,b){ if(level(a,b)===2 && Math.random()<0.5){ cur.div=true; return '<span>'+(a*b)+' ÷ '+b+' = </span><span class="ans" id="ans">&nbsp;</span>'; } cur.div=false; return a+' × '+b+' = <span class="ans" id="ans">&nbsp;</span>'; }
function distractors(a,b,ans){
  var c={}; c[ans]=1; var out=[ans];
  var cands=cur.div ? [a+1,a-1,a+2,b,ans+10] : [(a+1)*b,(a-1)*b,a*(b+1),a*(b-1),(a+1)*(b-1),a+b,ans+10,ans-10];
  shuffle(cands).forEach(function(v){ if(out.length<4 && v>0 && !c[v]){ c[v]=1; out.push(v); } });
  var k=1; while(out.length<4){ var v=ans+k; if(!c[v]&&v>0){c[v]=1;out.push(v);} k=-k+(k>0?0:1); if(k>40)break; }
  return out;
}
function next(){
  clearInterval(timerId);
  if(qi>=queue.length || Date.now()-sessionStart>180000){ return finish(); }
  cur=queue[qi]; typed=''; locked=false;
  var a=cur.f[0], b=cur.f[1];
  cur.answer=a*b; var html=fmt(a,b); if(cur.div) cur.answer=a;
  document.getElementById('fact').innerHTML=html;
  document.getElementById('fb').textContent=cur.newb&&!asked[key(a,b)]?'New one. Have a go.':''; document.getElementById('fb').className='fb';
  document.getElementById('qnum').textContent=qi+1;
  document.getElementById('progFill').style.width=(qi/queue.length*100)+'%';
  var tap=(mode==='race'); document.getElementById('pad').hidden=tap; var ch=document.getElementById('choices'); ch.hidden=!tap;
  if(tap){ ch.innerHTML=''; shuffle(distractors(a,b,cur.answer)).forEach(function(v){ var bt=document.createElement('button'); bt.textContent=v; bt.addEventListener('click',function(){ if(locked) return; typed=String(v); if(v===cur.answer) bt.classList.add('ok'); else bt.classList.add('no'); check(); }); ch.appendChild(bt); }); }
  tStart=Date.now();
  if(mode==='race'){ var fill=document.getElementById('timerFill'); fill.style.width='100%';
    timerId=setInterval(function(){ var left=1-(Date.now()-tStart)/tLimit; fill.style.width=Math.max(0,left*100)+'%'; if(left<=0){ clearInterval(timerId); timeout(); } },50); }
}
function answerEl(){ return document.getElementById('ans'); }
function input(d){
  if(locked) return;
  if(d==='del'){ typed=typed.slice(0,-1); }
  else if(d==='skip'){ return miss(true); }
  else { typed+=d; }
  answerEl().textContent=typed||' ';
  if(typed.length>=String(cur.answer).length) check();
}
function check(){
  locked=true; clearInterval(timerId);
  var ms=Date.now()-tStart, a=cur.f[0], b=cur.f[1], f=F(a,b), k=key(a,b);
  f.n++; f.last=S.sessions;
  if(+typed===cur.answer){
    var before=level(a,b);
    f.s++; right++; streak++; if(streak>(S.best||0)) S.best=streak;
    if(f.w>0 && f.s>=1) S.fixed=true;
    if(mode==='race'){ if(ms<3000){ f.f++; fastCount++; S.fastTotal=(S.fastTotal||0)+1; tLimit=Math.max(3000,tLimit-150); } }
    f.gap=Math.min(7,(f.gap||1)*2);
    var after=level(a,b); if(after>before) newCells.push([a,b,after]);
    answerEl().className='ans ok'; document.getElementById('fact').classList.add('pop');
    var fb=document.getElementById('fb'); fb.className='fb'; fb.innerHTML=mode==='race'&&ms<3000?'<b>Fast!</b>':'<b>Yes!</b>';
    setTimeout(function(){ document.getElementById('fact').classList.remove('pop'); qi++; next(); }, 450);
  } else miss(false);
}
function miss(skipped){
  locked=true; clearInterval(timerId);
  var a=cur.f[0], b=cur.f[1], f=F(a,b);
  f.s=0; f.w++; f.gap=1; if(mode==='race'){ f.f=Math.max(0,f.f-1); tLimit=Math.min(6000,tLimit+300); }
  wrong++; streak=0;
  answerEl().textContent=cur.answer; answerEl().className='ans no';
  document.getElementById('fact').classList.add('shake');
  var fb=document.getElementById('fb'); fb.className='fb no';
  fb.textContent=(cur.div? a+' × '+b+' = '+(a*b)+'. ' : '')+strategy(a,b);
  // re-ask within the next 5 (rec 7)
  var pos=Math.min(queue.length, qi+2+Math.floor(Math.random()*4));
  queue.splice(pos,0,{f:cur.f,newb:false,re:true});
  document.getElementById('qtot').textContent=queue.length;
  setTimeout(function(){ document.getElementById('fact').classList.remove('shake'); qi++; next(); }, 3000);
}
function timeout(){ if(locked) return; typed=''; miss(true); }

document.getElementById('pad').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; input(b.dataset.k||b.textContent.trim()); });
document.addEventListener('keydown',function(e){ if(!document.getElementById('play').classList.contains('on')) return;
  if(/^[0-9]$/.test(e.key)) input(e.key); else if(e.key==='Backspace') input('del'); else if(e.key==='Enter'&&typed&&!locked) check(); });

function finish(){
  clearInterval(timerId);
  S.sessions++;
  var today=new Date().toISOString().slice(0,10);
  if(S.days[S.days.length-1]!==today){
    var y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(S.days[S.days.length-1]!==y) S.days=[]; S.days.push(today);
  }
  var had12=S.had12; if(tensDone()&&!S.had12) S.had12=true;
  var moved=advance(); var got=checkBadges(); save();
  document.getElementById('doneTitle').textContent=right>=wrong*3?'Nice one!':'Good work.';
  document.getElementById('sRight').textContent=right; document.getElementById('sNew').textContent=newCells.length; document.getElementById('sFast').textContent=fastCount;
  var nl=document.getElementById('newList'); nl.innerHTML='';
  if(newCells.length){ newCells.forEach(function(c){ var s=document.createElement('span'); s.textContent=c[0]+' × '+c[1]+' = '+(c[0]*c[1])+(c[2]===2?'  — fast, now green':'  — now amber'); nl.appendChild(s); }); nl.hidden=false; }
  else { var s=document.createElement('span'); s.textContent=mode==='race'?'Keep racing to turn amber cells green.':'Come back tomorrow for the next new ones.'; nl.appendChild(s); }
  if(S.had12&&!had12){ var u=document.createElement('span'); u.style.background='var(--g1)'; u.style.color='#4A2E00'; u.textContent='All the way to 10! The grid now goes up to 12.'; nl.appendChild(u); }
  if(moved.length){ var m=document.createElement('span'); m.style.background='var(--g1)'; m.style.color='#4A2E00'; m.textContent='Table finished! Next up: the '+moved.join('s and the ')+'s.'; nl.appendChild(m); }
  var nb=document.getElementById('newBadges'); if(got.length){ nb.hidden=false; nb.innerHTML='<div class="label" style="margin-bottom:8px">New badge'+(got.length>1?'s':'')+'</div>'+got.map(function(g){return '<div style="font-size:18px">'+g[1]+' '+g[2]+' <span style="color:var(--muted);font-size:14px">— '+g[3]+'</span></div>'}).join(''); } else nb.hidden=true;
  show('done');
}
document.getElementById('goPractice').addEventListener('click',function(){start('practice')});
document.getElementById('goRace').addEventListener('click',function(){start('race')});
document.getElementById('quit').addEventListener('click',function(){ finish(); });
document.getElementById('again').addEventListener('click',function(){ start(mode); });
document.getElementById('homeBtn').addEventListener('click',function(){ drawHome(); show('home'); });
drawHome();
})();
</script>
